<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Forest Focus — Step 3</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07110d;color:#fff;overflow:hidden}.world{height:100%;position:relative;overflow:hidden;transition:background 1.5s}.world.rain{background:linear-gradient(#536d72 0%,#8ea4a3 45%,#536d52 72%,#263d24)}.world.summer{background:linear-gradient(#55bdf0 0%,#bdeaff 52%,#9ccc70 73%,#456a32)}.world.autumn{background:linear-gradient(#c97842 0%,#e8b16b 45%,#9b7545 72%,#59452b)}.world.winter{background:linear-gradient(#8ea6b8 0%,#dce9ee 55%,#b9ced0 75%,#71858a)}.world.spring{background:linear-gradient(#72c7e8 0%,#d6f4ef 48%,#91c878 72%,#497e3c)}
.scene{position:absolute;inset:0}.glass{background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.065));border:1px solid rgba(255,255,255,.25);box-shadow:0 20px 70px rgba(0,0,0,.16),inset 0 1px rgba(255,255,255,.35);backdrop-filter:blur(20px) saturate(145%);-webkit-backdrop-filter:blur(20px) saturate(145%)}
.top{position:absolute;z-index:20;top:16px;left:16px;right:16px;padding:13px 15px;border-radius:22px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:.2px}.season{font-size:12px;opacity:.78}.timer{font-size:38px;font-weight:800;letter-spacing:-2px;text-align:center}.sub{font-size:12px;opacity:.7;text-align:center;margin-top:2px}.hud{position:absolute;z-index:20;top:105px;left:50%;transform:translateX(-50%);width:min(88%,350px);padding:12px 16px;border-radius:20px;text-align:center}.progress{height:7px;background:rgba(255,255,255,.17);border-radius:99px;overflow:hidden;margin-top:9px}.bar{height:100%;width:0;border-radius:99px;background:rgba(255,255,255,.9);transition:width .15s linear}.hint{font-size:12px;opacity:.75;margin-top:7px}
.horizon{position:absolute;left:-10%;right:-10%;bottom:19%;height:23%;background:rgba(28,69,32,.32);filter:blur(2px);border-radius:50% 50% 0 0}.mountain{position:absolute;bottom:27%;width:0;height:0;border-left:120px solid transparent;border-right:120px solid transparent;border-bottom:180px solid rgba(49,75,65,.28)}.m1{left:5%}.m2{right:2%;border-left-width:160px;border-right-width:160px;border-bottom-height:210px}.mist{position:absolute;left:-10%;right:-10%;bottom:25%;height:12%;background:rgba(255,255,255,.16);filter:blur(20px);border-radius:50%}
.sun{position:absolute;width:100px;height:100px;border-radius:50%;right:13%;top:19%;background:#fff8c8;box-shadow:0 0 45px 18px rgba(255,244,166,.32);opacity:0;transition:opacity 1s}.summer .sun,.spring .sun{opacity:.95}.autumn .sun{opacity:.38}
.clouds{position:absolute;top:17%;left:0;right:0;height:25%;pointer-events:none;opacity:0;transition:opacity 1s}.rain .clouds,.winter .clouds{opacity:1}.cloud{position:absolute;width:180px;height:55px;background:rgba(42,55,59,.82);border-radius:60px;filter:blur(.2px);box-shadow:inset 0 8px 16px rgba(255,255,255,.08)}.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}.cloud:before{width:78px;height:78px;left:25px;top:-38px}.cloud:after{width:96px;height:96px;right:25px;top:-52px}.c1{left:-20px;top:55px;animation:drift 18s linear infinite}.c2{right:-55px;top:8px;transform:scale(.75);animation:drift2 22s linear infinite}.c3{left:31%;top:88px;transform:scale(.62);opacity:.7;animation:drift 25s linear infinite}@keyframes drift{to{transform:translateX(80px)}}@keyframes drift2{to{transform:translateX(-90px) scale(.75)}}
.ground{position:absolute;left:-5%;right:-5%;bottom:-7%;height:34%;background:rgba(39,76,31,.65);border-radius:50% 50% 0 0;box-shadow:0 -20px 50px rgba(20,50,20,.18)}.winter .ground{background:rgba(235,246,247,.82)}.autumn .ground{background:rgba(109,77,38,.7)}.rain .ground{background:rgba(41,76,37,.72)}
.tree-area{position:absolute;left:50%;bottom:15%;width:300px;height:390px;transform:translateX(-50%);z-index:8}.tree{position:absolute;left:50%;bottom:0;width:260px;height:360px;transform:translateX(-50%) scale(.5);transform-origin:50% 100%;transition:transform .25s}.trunk{position:absolute;bottom:0;left:50%;width:20px;height:220px;transform:translateX(-50%) scaleY(0);transform-origin:bottom;background:linear-gradient(90deg,#54321e,#81532d 48%,#4d2d1b);border-radius:12px 12px 5px 5px;box-shadow:inset 5px 0 rgba(255,255,255,.08)}.branch{position:absolute;background:#5b351f;height:12px;border-radius:12px;transform-origin:left center;opacity:0}.b1{left:50%;bottom:125px;width:105px;transform:rotate(-34deg) scaleX(0)}.b2{left:50%;bottom:165px;width:92px;transform:rotate(31deg) scaleX(0)}.b3{left:50%;bottom:200px;width:75px;transform:rotate(-27deg) scaleX(0)}.b4{left:50%;bottom:92px;width:80px;transform:rotate(28deg) scaleX(0)}.crown{position:absolute;left:50%;top:20px;width:235px;height:190px;transform:translateX(-50%) scale(.15);opacity:0}.blob{position:absolute;border-radius:50%;background:radial-gradient(circle at 32% 25%,#74ad57 0 12%,#478d45 42%,#28683b 100%);box-shadow:inset -9px -12px 18px rgba(0,0,0,.12)}.bl1{width:105px;height:105px;left:10px;top:48px}.bl2{width:125px;height:125px;left:65px;top:25px}.bl3{width:100px;height:100px;left:132px;top:58px}.bl4{width:90px;height:90px;left:72px;top:82px}.pine .crown{width:190px;height:260px;top:20px}.pine .blob{border-radius:18% 82% 40% 60% / 20% 35% 65% 80%;background:linear-gradient(145deg,#4e9652,#215f3b)}.pine .bl1{width:115px;height:100px;left:38px;top:40px}.pine .bl2{width:145px;height:105px;left:22px;top:91px}.pine .bl3{width:175px;height:110px;left:7px;top:148px}.pine .bl4{width:155px;height:90px;left:18px;top:198px}
.seed{position:absolute;left:50%;bottom:1px;width:38px;height:29px;transform:translateX(-50%) rotate(-14deg);background:linear-gradient(145deg,#9a6339,#57351f);border-radius:70% 45% 65% 38%;box-shadow:inset 7px 3px 0 rgba(255,255,255,.12),0 6px 15px rgba(0,0,0,.2);z-index:4}.seed:after{content:"";position:absolute;left:8px;top:4px;width:9px;height:5px;border-radius:50%;background:rgba(255,255,255,.16)}
.sprout{position:absolute;left:50%;bottom:0;width:70px;height:80px;transform:translateX(-50%);opacity:0}.stem{position:absolute;left:50%;bottom:0;width:7px;height:62px;background:#3d793e;border-radius:8px;transform:translateX(-50%)}.leaf{position:absolute;width:42px;height:23px;background:#4e9b4d;border-radius:100% 0 100% 0}.leaf.l{left:5px;top:20px;transform:rotate(-27deg)}.leaf.r{right:5px;top:10px;transform:scaleX(-1) rotate(-27deg)}
.drops,.snowflakes,.leaves{position:absolute;inset:0;pointer-events:none;z-index:10}.drop{position:absolute;top:-30px;width:2px;height:18px;border-radius:4px;background:rgba(210,239,255,.72);animation:fall linear infinite}.snowflake{position:absolute;top:-20px;font-size:13px;opacity:.8;animation:snowfall linear infinite}.fallleaf{position:absolute;top:-30px;font-size:19px;animation:leafFall linear infinite}@keyframes fall{to{transform:translateY(120vh)}}@keyframes snowfall{to{transform:translate3d(70px,120vh,0) rotate(360deg)}}@keyframes leafFall{to{transform:translate3d(90px,120vh,0) rotate(450deg)}}
.controls{position:absolute;z-index:30;left:16px;right:16px;bottom:18px;padding:14px;border-radius:25px;display:flex;gap:10px;align-items:center}.mainbtn{flex:1;border:0;border-radius:18px;padding:15px;background:rgba(255,255,255,.9);color:#15351f;font-weight:800;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.15);cursor:pointer}.smallbtn{width:48px;height:48px;border-radius:16px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.12);color:white;font-size:18px}.modal{position:absolute;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center;background:rgba(3,10,7,.38);backdrop-filter:blur(7px)}.modal.show{display:flex}.sheet{width:min(100%,460px);padding:26px 20px 25px;border-radius:30px 30px 0 0;text-align:center}.sheet h2{margin:0 0 7px;font-size:25px}.sheet p{margin:0 0 18px;opacity:.78}.sheet button{width:100%;border:0;border-radius:17px;padding:15px;font-weight:800;font-size:15px}.danger{background:#fff;color:#3a2018}.success{background:#fff;color:#163a22}.dead-preview{font-size:52px;margin-bottom:4px}
@media(min-width:600px){.controls{left:50%;right:auto;width:428px;transform:translateX(-50%)}}
</style></head><body><div id="world" class="world rain"><div class="scene"><div class="sun"></div><div class="clouds"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div></div><div class="mountain m1"></div><div class="mountain m2"></div><div class="mist"></div><div class="horizon"></div><div class="ground"></div><div class="drops"></div><div class="snowflakes"></div><div class="leaves"></div><div class="tree-area"><div id="tree" class="tree"><div class="trunk"></div><div class="branch b1"></div><div class="branch b2"></div><div class="branch b3"></div><div class="branch b4"></div><div class="crown"><i class="blob bl1"></i><i class="blob bl2"></i><i class="blob bl3"></i><i class="blob bl4"></i></div><div class="sprout"><div class="stem"></div><i class="leaf l"></i><i class="leaf r"></i></div><div class="seed"></div></div></div></div>
<div class="top glass"><div><div class="brand">🌲 Forest Focus</div><div id="season" class="season">Rainy Season</div></div><div><div id="timer" class="timer">00:00</div><div class="sub">focus to grow</div></div></div><div class="hud glass"><div id="stage">Seed</div><div class="progress"><div id="bar" class="bar"></div></div><div id="hint" class="hint">Your seed is waiting for focus.</div></div><div class="controls glass"><button id="start" class="mainbtn">Start Growing</button><button id="resetBtn" class="smallbtn" title="Reset">↺</button></div>
<div id="interrupt" class="modal"><div class="sheet glass"><div class="dead-preview">🪾</div><h2>Growth Interrupted</h2><p>Your tree withered because focus was interrupted.</p><button class="danger" id="again">Begin Again</button></div></div><div id="complete" class="modal"><div class="sheet glass"><div id="finalIcon" class="dead-preview">🌳</div><h2>Tree Fully Grown</h2><p>You stayed focused through every season. Your tree is ready for the forest.</p><button class="success" id="add">Add to Forest</button></div></div>
<script>
const D=60;let startTime=0,elapsed=0,running=false,raf=null,finalType=Math.random()<.5?'oak':'pine';const world=document.getElementById('world'),timer=document.getElementById('timer'),bar=document.getElementById('bar'),stage=document.getElementById('stage'),hint=document.getElementById('hint'),season=document.getElementById('season'),tree=document.getElementById('tree');
function particles(){const d=document.querySelector('.drops'),s=document.querySelector('.snowflakes'),l=document.querySelector('.leaves');for(let i=0;i<85;i++){let e=document.createElement('i');e.className='drop';e.style.left=Math.random()*100+'%';e.style.animationDuration=(.55+Math.random()*.7)+'s';e.style.animationDelay=(-Math.random()*1.5)+'s';d.appendChild(e)}for(let i=0;i<45;i++){let e=document.createElement('i');e.className='snowflake';e.textContent='•';e.style.left=Math.random()*100+'%';e.style.animationDuration=(4+Math.random()*5)+'s';e.style.animationDelay=(-Math.random()*7)+'s';s.appendChild(e)}for(let i=0;i<24;i++){let e=document.createElement('i');e.className='fallleaf';e.textContent=Math.random()<.5?'🍂':'🍁';e.style.left=Math.random()*100+'%';e.style.animationDuration=(5+Math.random()*6)+'s';e.style.animationDelay=(-Math.random()*9)+'s';l.appendChild(e)}}particles();
function setSeason(x){world.className='world '+x;const names={rain:'Rainy Season',summer:'Summer',autumn:'Autumn',winter:'Winter',spring:'Spring'};season.textContent=names[x];document.querySelector('.drops').style.opacity=x==='rain'?'1':'0';document.querySelector('.snowflakes').style.opacity=x==='winter'?'1':'0';document.querySelector('.leaves').style.opacity=x==='autumn'?'1':'0'}
function render(){const p=Math.min(elapsed/D,1);timer.textContent=new Date(elapsed*1000).toISOString().substr(14,5);bar.style.width=(p*100)+'%';let s,h; if(p<.14){s='Seed';h='A quiet beginning. Stay focused.';tree.style.transform='translateX(-50%) scale('+(.48+p*1.0)+')';document.querySelector('.seed').style.opacity=1;document.querySelector('.sprout').style.opacity=0;document.querySelector('.trunk').style.transform='translateX(-50%) scaleY(0)'}else if(p<.30){s='Sprout';h='The first leaves are opening.';tree.style.transform='translateX(-50%) scale(.62)';document.querySelector('.seed').style.opacity=0;document.querySelector('.sprout').style.opacity=(p-.14)/.16;document.querySelector('.trunk').style.transform='translateX(-50%) scaleY(.12)'}else if(p<.45){s='Young Plant';h='Roots are settling in. Leaves are multiplying.';tree.style.transform='translateX(-50%) scale(.72)';document.querySelector('.sprout').style.opacity=0;document.querySelector('.trunk').style.transform='translateX(-50%) scaleY(.32)'}else if(p<.62){s='Growing Tree';h='Branches are reaching outward.';tree.style.transform='translateX(-50%) scale(.82)';document.querySelector('.trunk').style.transform='translateX(-50%) scaleY(.58)';document.querySelectorAll('.branch').forEach((b,i)=>b.style.transform=(i%2?'rotate(31deg)':'rotate(-34deg)')+' scaleX('+Math.min(1,(p-.45)/.17)+')')}else if(p<.82){s='Maturing Tree';h='The canopy is filling out.';tree.style.transform='translateX(-50%) scale(.92)';document.querySelector('.trunk').style.transform='translateX(-50%) scaleY(.82)';document.querySelector('.crown').style.opacity=Math.min(1,(p-.62)/.2);document.querySelector('.crown').style.transform='translateX(-50%) scale('+(.35+(p-.62)/.2*.65)+')';}else{s='Full Tree';h='Every season has passed. Almost there.';tree.style.transform='translateX(-50%) scale(1)';document.querySelector('.trunk').style.transform='translateX(-50%) scaleY(1)';document.querySelectorAll('.branch').forEach(b=>b.style.transform=(b.classList.contains('b2')||b.classList.contains('b4')?'rotate(31deg)':'rotate(-34deg)')+' scaleX(1)');document.querySelector('.crown').style.opacity=1;document.querySelector('.crown').style.transform='translateX(-50%) scale(1)'}stage.textContent=s;hint.textContent=h;setSeason(p<.2?'rain':p<.4?'summer':p<.6?'autumn':p<.8?'winter':'spring');if(p>=1){running=false;cancelAnimationFrame(raf);document.getElementById('finalIcon').textContent=finalType==='pine'?'🌲':'🌳';document.getElementById('complete').classList.add('show')}}
function loop(t){if(!running)return;if(!startTime)startTime=t-elapsed*1000;elapsed=Math.min((t-startTime)/1000,D);render();raf=requestAnimationFrame(loop)}
function start(){if(running)return;running=true;startTime=performance.now()-elapsed*1000;document.getElementById('start').textContent='Growing…';raf=requestAnimationFrame(loop)}
function reset(){running=false;cancelAnimationFrame(raf);elapsed=0;startTime=0;finalType=Math.random()<.5?'oak':'pine';document.getElementById('start').textContent='Start Growing';document.getElementById('interrupt').classList.remove('show');document.getElementById('complete').classList.remove('show');document.querySelector('.crown').style.opacity=0;document.querySelector('.crown').style.transform='translateX(-50%) scale(.15)';document.querySelectorAll('.branch').forEach(b=>b.style.transform='rotate(0deg) scaleX(0)');render()}
document.getElementById('start').onclick=start;document.getElementById('resetBtn').onclick=reset;document.getElementById('again').onclick=reset;document.getElementById('add').onclick=reset;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){running=false;cancelAnimationFrame(raf);document.getElementById('interrupt').classList.add('show')}});window.addEventListener('blur',()=>{if(running){running=false;cancelAnimationFrame(raf);document.getElementById('interrupt').classList.add('show')}});render();
</script></body></html>
